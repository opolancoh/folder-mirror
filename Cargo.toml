[package]
name = "folder-mirror"
version = "0.1.0"
edition = "2021"
description = "One-way folder mirroring: analyze the differences and make a mirror identical to its source"
rust-version = "1.80"

[lib]
name = "folder_mirror"
path = "src/lib.rs"

[[bin]]
name = "mirror"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console = "0.15"
csv = "1"
ctrlc = "3"
fs2 = "0.4"
globset = "0.4"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
trash = "5"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
